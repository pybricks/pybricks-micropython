[project]
name = "pybricks-micropython"
version = "0.1.0"
description = "Development dependencies for pybricks-micropython"
authors = [{ name = "The Pybricks Authors", email = "dev@pybricks.com" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "argcomplete>=3.7.2",
    "bleak>=3.0.2",
    "hidapi>=0.15.0",
    "matplotlib>=3.11.2",
    "plotly>=7.1.0",
    "pre-commit>=4.7.0",
    "pybricks>=4.1.0",
    "pygame>=2.6.1",
    "pyserial>=3.5",
    "pyusb>=1.3.1",
    "scipy>=1.18.1",
    "semver>=3.1.0",
    "sympy>=1.14.0",
    "tqdm>=4.70.1",
]
build = [
    "cairosvg>=2.9.1",
    "freetype-py>=2.5.1",
    "gitpython>=3.2.1",
    "pillow>=12.3.0",
]
lint = [
    "micropython-uncrustify>=1.0.0.post1",
    "ruff>=0.17.0",
]

[tool.uv]
package = false
default-groups = "all"
required-version = ">=0.12.24"
# Supply chain hardening: only consider releases that are at least 7 days old
# and never execute third-party build scripts (wheels only).
exclude-newer = "7 days"
no-build = true

[tool.ruff]
extend-exclude = ["lib/btstack/", "micropython/"]
