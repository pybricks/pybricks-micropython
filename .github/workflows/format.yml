name: Format

# TODO: only do this on pull requests and add commit if there is a diff
# NB: Paths should match paths defined in ./tools/codeformat.py
on:
  push:
    paths:
    - ".github/workflows/format.yml"
    - "bricks/**/*.[ch]"
    - "lib/aeabi_div/**/*.[ch]"
    - "lib/lego/**/*.[ch]"
    - "lib/pbio/**/*.[ch]"
    - "py/*.[ch]"
    - "pybricks/**/*.[ch]"
    - "bricks/**/*.py"
    - "tests/**/*.py"
    - "tools/**/*.py"
  pull_request:
    paths:
    - ".github/workflows/format.yml"
    - "bricks/**/*.[ch]"
    - "lib/aeabi_div/**/*.[ch]"
    - "lib/lego/**/*.[ch]"
    - "lib/pbio/**/*.[ch]"
    - "py/*.[ch]"
    - "pybricks/**/*.[ch]"
    - "bricks/**/*.py"
    - "tests/**/*.py"
    - "tools/**/*.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Check code formatting
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: Install uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      with:
        version: "0.12.24"
    - run: uv sync --locked --only-group lint
    - name: Format C code
      run: uv run --no-sync ./tools/codeformat.py -c
    - name: Format Python code
      run: uv run --no-sync ruff format .
    - name: Check for changes
      run: git diff --exit-code
